<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>AI 진로 스테이션 결과지</title>
<style>
@font-face{font-family:'Wanted Sans Variable';font-weight:400 1000;font-display:swap;src:url(fonts/WantedSansVariable.woff2) format('woff2')}
:root{
  --platform:#EDF0F3; --paper:#fff; --sign:#18212F; --muted:#5B6676; --rule:#D2D8E0;
  --signal:#FFC21A; --signal-tint:#FFF3CC; --alert:#D8434F; --good:#12A26E;
  --line-c:#12A26E; --line-i:#F0761A; --line-m:#2F64D8; --line:var(--sign);
}
body.k-c{--line:var(--line-c)} body.k-i{--line:var(--line-i)} body.k-m{--line:var(--line-m)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--platform);color:var(--sign);font:500 16px/1.6 'Wanted Sans Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif;letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
/* 표지판 머리 */
.sign{background:var(--sign);color:#fff;border-radius:14px;border-left:12px solid var(--line);padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px}
.sign .row{display:flex;align-items:center;gap:10px}
.dot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:900;font-size:16px;color:#fff}
.sign small{font-size:14px;color:rgba(255,255,255,.75);font-weight:600}
.sign h1{font-size:28px;line-height:1.25;font-weight:900;letter-spacing:-.03em}
.sign p{font-size:15px;color:rgba(255,255,255,.8)}
/* 종이 */
.card{background:var(--paper);border:2px solid var(--rule);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
.muted{color:var(--muted);font-size:14px}
.badge{align-self:flex-start;background:var(--sign);color:#fff;border-radius:10px;padding:6px 12px;font-weight:800;font-size:18px}
.trait{font-size:15px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:5.5em 1fr 1.6em;align-items:center;gap:8px;font-size:14px}
.bar i{height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.bar u{display:block;height:100%;background:#9AA5B4}
.bar.top b,.bar.top span{font-weight:900}.bar.top u{background:var(--line)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.ment{background:var(--platform);border-radius:12px;padding:12px 14px;font-weight:600}
/* 승차권: 추천 직업 */
.ticket{background:var(--paper);border-radius:16px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 0 56px,var(--platform) 11px,transparent 12px),radial-gradient(circle at 100% 56px,var(--platform) 11px,transparent 12px),var(--paper)}
.ticket .stub{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;height:56px;border-bottom:3px dashed var(--rule)}
.ticket .stub b{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.ticket .stub b::before{content:'';width:16px;height:16px;border-radius:50%;background:var(--line)}
.ticket .stub span{font-size:14px;color:var(--muted);font-weight:700}
.ticket .body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:14px}
.who img{width:64px;height:64px;border-radius:50%;background:#FFE2B4;object-fit:cover;flex:none}
.who h3{font-size:22px;font-weight:900;letter-spacing:-.03em;line-height:1.2}
.who p{font-size:14px;color:var(--muted)}
.fit{font-weight:800;color:var(--good)}
.fut{display:inline-block;background:var(--alert);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800;margin-left:6px;vertical-align:2px}
dl{margin:0;display:grid;grid-template-columns:6.2em 1fr;gap:6px 10px;font-size:15px}
dt{color:var(--muted);font-weight:700}dd{margin:0}
details{border-top:1px solid var(--rule);padding-top:8px}
summary{cursor:pointer;font-weight:800;font-size:15px;color:var(--sign);list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:'+';display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--platform);font-weight:900}
details[open] summary::before{content:'−'}
details > *:not(summary){margin-top:10px}
.todo{background:var(--signal-tint);border-radius:12px;padding:10px 14px;font-weight:700}
.todo b{display:block;font-size:13px;color:#7A5A00}
ol.qa{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:15px}
ol.qa span{color:var(--muted)}
/* 인터뷰 */
.hero{display:flex;align-items:flex-end;gap:12px}
.hero img{height:200px;flex:none}
.hero .who-t h3{font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1.2}
.qitem{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--rule)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem b{font-size:15px}.qitem p{font-size:15px}
.quote{background:var(--platform);border-radius:12px;padding:12px 14px;font-weight:700}
/* 면접 */
.scale{display:inline-flex;border:2px solid var(--rule);border-radius:10px;overflow:hidden;font-size:13px;font-weight:800;align-self:flex-start}
.scale i{font-style:normal;padding:4px 10px;color:var(--muted)}
.scale i + i{border-left:2px solid var(--rule)}
.scale i.on{background:var(--sign);color:#fff}
.mq h3{font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mq h3 small{font-size:13px;color:var(--muted);font-weight:700}
.mq .qtext{font-weight:700}
.two{display:grid;gap:10px}
.two h4{margin:0 0 4px;font-size:14px}
.two ul{margin:0;padding-left:1.2em;font-size:15px}
.two .g h4{color:var(--good)}.two .b h4{color:var(--alert)}
.polish{background:#EEF3FC;border-left:5px solid var(--line-m);border-radius:10px;padding:10px 12px;font-size:15px;white-space:pre-line}
.polish h4{margin:0 0 4px;font-size:14px;color:var(--line-m)}
mark{background:var(--signal-tint);color:#6B4E00;border-radius:4px;padding:0 3px}
/* 바닥 */
.foot{font-size:13px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px;padding-top:4px}
.save{align-self:center;font:inherit;font-weight:800;font-size:16px;background:var(--signal);color:var(--sign);border:2px solid var(--sign);border-radius:12px;padding:10px 18px;box-shadow:0 4px 0 var(--sign);cursor:pointer}
.save:active{transform:translateY(4px);box-shadow:none}
.empty{text-align:center;padding:40px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h1{font-size:24px}
.strip{height:18px;border-radius:5px;background:radial-gradient(circle,#E2A600 0 3px,transparent 4px) 0 0/14px 14px,var(--signal);border-top:4px solid var(--sign)}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff}.save{display:none}}
</style>
</head>
<body>
<main class="wrap" id="app"><p class="muted">결과지를 여는 중이에요…</p></main>
<script src="data.js"></script>
<script>
(function(){
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TK = ['R','I','A','S','E','C'];
const CT = {kid:{R:['만들기 대장','🔧'],I:['호기심 박사','🔬'],A:['상상력 요정','🎨'],S:['도움 천사','💖'],E:['리더 캡틴','🚀'],C:['꼼꼼 마스터','📋']},
            teen:{R:['현실형','🔧'],I:['탐구형','🔬'],A:['예술형','🎨'],S:['사회형','💖'],E:['진취형','🚀'],C:['관습형','📋']}};
const TRAIT = {R:'직접 만들고 다루는 힘', I:'깊이 탐구하는 힘', A:'창의적으로 표현하는 힘', S:'사람을 돕고 공감하는 힘', E:'앞장서서 이끄는 힘', C:'체계적으로 계획하는 힘'};
const LVL = {elementary:'초등', middle:'중등', high:'고등'};
const img = (id, kind) => `img/${id}_${kind}.webp`;
// 받침 있는지 보고 조사 고르기 (이/가, 은/는, 을/를, 과/와)
const jong = s => { const h = String(s).match(/[가-힣](?=[^가-힣]*$)/); return h ? (h[0].charCodeAt(0) - 0xAC00) % 28 !== 0 : false; };
const PAIR = {'이':['이','가'],'가':['이','가'],'은':['은','는'],'는':['은','는'],'을':['을','를'],'를':['을','를'],'과':['과','와'],'와':['과','와']};
const josa = (w, p) => w + PAIR[p][jong(w) ? 0 : 1];
const fill = (t, v) => t.replace(/\{(major|job|school)\}(이|가|을|를|과|와|은|는)?/g, (m, k, p) => p ? josa(v, p) : v);

async function unpack(s){
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4);
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const text = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  return JSON.parse(text);
}
const sign = (n, kicker, title, sub) => `<header class="sign"><div class="row"><span class="dot">${n}</span><small>${esc(kicker)}</small></div><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</header>`;
const foot = () => `<button class="save" type="button" id="save">이 결과지 저장하기</button>
  <div class="foot"><p>AI 진로 스테이션 · 결과는 이 화면에만 있고 어디에도 저장되지 않아요.</p><p>화면을 캡처하거나 이 페이지를 즐겨찾기에 넣어 두세요.</p></div><div class="strip" aria-hidden="true"></div>`;
const jobDetail = j => `<dl><dt>하는 일</dt><dd>${esc(j.a.daily)}</dd><dt>되는 길</dt><dd>${esc(j.a.path)}</dd><dt>필요한 과목</dt><dd>${esc(j.a.subjects)}</dd>
  <dt>좋은 점</dt><dd>${esc(j.pro)}</dd><dt>힘든 점</dt><dd>${esc(j.con)}</dd><dt>미래 전망</dt><dd>${esc(j.a.outlook)}</dd></dl>`;

function counsel(r){
  const names = r.l === 'elementary' ? CT.kid : CT.teen, tn = t => names[t][0], te = t => names[t][1];
  const [m, sb] = r.t, max = Math.max(1, ...r.s);
  const bank = D.q[r.l] || [];
  const tickets = r.j.map(([code, pct], i) => { const j = D.jobs[code]; if(!j) return '';
    return `<article class="ticket"><div class="stub"><b>코드 ${esc(code)}</b><span>추천 ${i + 1}위</span></div><div class="body">
      <div class="who"><img src="${img(j.id, 'face')}" alt="" loading="lazy"><div><h3>${esc(j.n)}${j.f ? '<span class="fut">미래 유망</span>' : ''}</h3><p class="fit">나와 맞는 정도 ${pct}%</p></div></div>
      <p>${esc(j.d)}</p><div class="todo"><b>오늘 해볼 것</b>${esc(j.td)}</div>
      <details><summary>이 직업 더 알아보기</summary>${jobDetail(j)}</details></div></article>`; }).join('');
  const qa = r.a.map(([qi, t]) => { const q = bank[qi]; if(!q) return ''; const o = q[1][t] || ['', ''];
    return `<li>${esc(q[0])}<br><span>${esc(o[0])} ${esc(o[1])} · ${esc(tn(t))}</span></li>`; }).join('');
  return sign(1, 'AI 직업상담 결과', `${r.n}의 진로 탐색 결과`, `${LVL[r.l] || ''} · ${r.d}`) +
    `<section class="card"><h2>나의 흥미 유형</h2><span class="badge">${te(m)} ${esc(tn(m))}${sb && sb !== m ? ` + ${te(sb)} ${esc(tn(sb))}` : ''}</span>
      <p class="trait">${esc(tn(m))}: ${TRAIT[m]}${sb && sb !== m ? `<br>${esc(tn(sb))}: ${TRAIT[sb]}` : ''}</p>
      <div class="bars">${TK.map((t, i) => `<div class="bar${t === m || t === sb ? ' top' : ''}"><span>${te(t)} ${esc(tn(t))}</span><i><u style="width:${r.s[i] / max * 100}%"></u></i><b>${r.s[i]}</b></div>`).join('')}</div></section>
    <section class="card"><h2>상담 결과</h2><p class="ment">${esc(r.m)}</p></section>
    <section style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:19px">추천 직업 3</h2>${tickets}
      <p class="muted">직업 코드를 부스의 AI 직업인 인터뷰·모의 면접에서 입력하면 그 직업으로 바로 체험할 수 있어요.</p></section>
    <section class="card"><details><summary>질문과 나의 대답 ${r.a.length}개</summary><ol class="qa">${qa}</ol></details></section>`;
}

function interview(r){
  const j = D.jobs[r.j]; if(!j) return bad();
  const items = r.g.map(([key, q, sum], i) => {
    const s = key === 'free' ? sum : key === 'pros_cons' ? `${j.pro} / ${j.con}` : (j.a[key] || sum || '');
    return `<div class="qitem"><b>Q${i + 1}. ${esc(q)}</b><p>${esc(s)}</p></div>`; }).join('');
  return sign(2, 'AI 직업인 인터뷰 노트', `${j.n} ${j.ex} 님과의 인터뷰`, `직업 코드 ${r.j} · ${r.d}`) +
    `<section class="card"><div class="hero"><img src="${img(j.id, 'full')}" alt=""><div class="who-t"><h3>${esc(j.n)}</h3><p class="muted">${esc(j.ex)} 님</p><p>${esc(j.d)}</p></div></div></section>
    <section class="card"><h2>내가 한 질문과 답 요약</h2>${items || '<p class="muted">이번에는 질문 기록이 없어요.</p>'}${r.w ? `<p class="quote">기억에 남는 한마디 · "${esc(r.w)}"</p>` : ''}</section>
    <section class="card"><h2>이 직업 한눈에 보기</h2>${jobDetail(j)}<div class="todo"><b>오늘 해볼 것</b>${esc(j.td)}</div></section>
    <p class="muted">직업 코드 ${esc(r.j)}를 부스의 AI 모의 면접에서 입력하면 이 직업으로 면접 연습을 할 수 있어요. 인터뷰 답변은 실제 직업인 자료를 바탕으로 만든 연습용 내용이에요.</p>`;
}

function mock(r){
  const T = D.bank[r.y] || {n:'', q:{}}, job = r.j ? D.jobs[r.j] : null, steps = ['practice', 'ok', 'good'];
  const scale = lv => `<span class="scale">${steps.map(k => `<i class="${k === lv ? 'on' : ''}">${esc(D.lv[k])}</i>`).join('')}</span>`;
  const qtext = id => {
    if(id === 'AI-J' && job) return `${josa(job.n, '은')} '${job.a.daily}' 같은 일을 해요. 이 중 가장 해 보고 싶은 일과 그 이유를 말해주세요.`;
    if(id === 'AI-M' && job) return `${josa(job.n, '이')} 되려면 '${job.a.path}' 과정이 필요해요. 입학 후 이를 위해 어떤 공부와 활동을 하고 싶은가요?`;
    return T.q[id] ? fill(T.q[id][0], r.t) : (String(id || '').length > 8 ? id : '');   // 예전 QR은 질문 문장을 그대로 담았음
  };
  const items = r.q.map((it, i) => `<section class="card mq"><h3><span>질문 ${i + 1} <small>${esc(it.g)}</small></span>${scale(it.l)}</h3>
      <p class="qtext">${esc(qtext(it.x))}</p>
      <div class="two"><div class="g"><h4>잘한 점</h4><ul>${(it.s || []).map(s => `<li>${esc(s)}</li>`).join('') || '<li>끝까지 답한 것 자체가 좋은 연습이에요</li>'}</ul></div>
        <div class="b"><h4>더 좋아지려면</h4><ul>${((it.i && it.i.length) ? it.i : ['지금 흐름을 그대로 유지해도 좋아요']).map(s => `<li>${esc(s)}</li>`).join('')}</ul></div></div>
      ${it.r ? `<div class="polish"><h4>이렇게 다듬어 말해 보세요</h4>${esc(it.r).replace(/\[([^\]]+)\]/g, '<mark>$1</mark>')}</div>` : ''}</section>`).join('');
  return sign(3, 'AI 모의 면접 피드백', r.t, `${T.n} · ${r.d}`) +
    `<section class="card"><h2>총평</h2>${scale(r.o)}<p>${esc(r.c)}</p><div class="todo"><b>다음 연습</b>${esc(r.p)}</div></section>${items}
    <p class="muted">${esc(D.notice)}</p>`;
}

function bad(why){
  return `<section class="empty"><h1>결과지를 열 수 없어요</h1><p>${esc(why || 'QR 주소가 잘렸거나 오래된 형식이에요.')}</p><p class="muted">부스 화면의 QR을 다시 찍어 주세요.</p></section><div class="strip" aria-hidden="true"></div>`;
}
async function main(){
  const h = location.hash.slice(1);
  if(!h){ app.innerHTML = `<section class="empty"><h1>AI 진로 스테이션</h1><p>체험을 마친 뒤 부스 화면에 나오는 QR을 휴대폰 카메라로 찍으면 여기에 결과지가 열려요.</p></section><div class="strip" aria-hidden="true"></div>`; return; }
  if(!('DecompressionStream' in window)){ app.innerHTML = bad('이 휴대폰의 브라우저가 오래돼서 결과지를 풀 수 없어요. 크롬이나 사파리를 최신으로 업데이트해 주세요.'); return; }
  let r; try{ r = await unpack(h); }catch(e){ app.innerHTML = bad(); return; }
  document.body.className = 'k-' + r.k;
  const html = r.k === 'c' ? counsel(r) : r.k === 'i' ? interview(r) : r.k === 'm' ? mock(r) : bad();
  app.innerHTML = html + (/^(c|i|m)$/.test(r.k) ? foot() : '');
  document.title = ({c:'나의 진로 탐색 결과', i:'직업인 인터뷰 노트', m:'모의 면접 피드백'}[r.k] || '결과지') + ' · AI 진로 스테이션';
  const sv = document.getElementById('save');
  if(sv) sv.onclick = async () => {
    if(navigator.share){ try{ await navigator.share({title:document.title, url:location.href}); return; }catch(e){ if(e && e.name === 'AbortError') return; } }
    window.print();
  };
}
main();
})();
</script>
</body>
</html>
